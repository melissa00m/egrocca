# ==============================================================================
# Mosquitto MQTT Broker Configuration - Rural Delivery Droid Fleet
# Hardened TLS v1.3 / v1.2 with Mutual Authentication (mTLS)
# ==============================================================================

# General Configuration
pid_file /var/run/mosquitto/mosquitto.pid
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout

# Verbose security logging
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ==============================================================================
# SECURE TLS LISTENER (PORT 8883)
# ==============================================================================
listener 8883 0.0.0.0
protocol mqtt

# Certificate Paths (adjust paths to your environment)
# On Linux/Docker: /etc/mosquitto/certs/
# On Windows: C:/Users/mubay/OneDrive/Documentos/egrocca certificates/tls_mqtt_broker/certs/
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key

# Require client certificates (mTLS - Mutual Authentication)
# Prevents unauthorized/untrusted devices from connecting to the broker
require_certificate true

# Extract client Common Name (CN) from certificate as MQTT username
# e.g., CN="droid-alpha-01" becomes username="droid-alpha-01"
use_identity_as_username true

# Enforce TLS 1.3 / 1.2 modern protocols
tls_version tlsv1.3

# High-security modern ciphers (Disable weak DES/RC4/MD5/SHA1)
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

# ==============================================================================
# SECURITY & ACCESS CONTROL
# ==============================================================================
allow_anonymous false

# Optional: Disable unencrypted listener on port 1883 completely in production
# (Uncomment the line below if you only want encrypted TLS traffic)
# port 0

# Rate limiting to mitigate DoS / battery-drain attacks over rural cellular links
max_connections 500
max_queued_messages 1000
max_inflight_messages 20
max_packet_size 65536

# Keepalive timeouts for rural intermittent cellular / satellite connectivity
keepalive_interval 60

# ==============================================================================
# TOPIC ACCESS CONTROL LIST (ACL) PERMISSIONS
# Save in /etc/mosquitto/acl.conf or reference below:
# ==============================================================================
# Pattern rules automatically map the client certificate CN (%u) to allowed topics:
#
# Droid pattern permissions:
# pattern write droid/%u/telemetry
# pattern write droid/%u/tamper
# pattern read droid/%u/command/#
# pattern write droid/%u/status
#
# Node-RED Central Dispatch pattern:
# user nodered-central-dispatch
# topic readwrite droid/#
# ==============================================================================

